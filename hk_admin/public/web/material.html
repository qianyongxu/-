<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>素材详情 - 绘库</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #000000;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Background */
        .ambient-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }
        .orb-1 { top: -100px; left: -100px; background: #007AFF; }
        .orb-2 { bottom: -100px; right: -100px; background: #FF2D55; }

        .container {
            padding: 20px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .app-logo { font-weight: bold; font-size: 18px; }

        /* Material Card */
        .material-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .preview-image {
            width: 100%;
            display: block;
            min-height: 200px;
            object-fit: cover;
            background: #1a1a1a;
        }

        .content {
            padding: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .meta-info {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tag {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Download Button */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .download-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: #1c1c1e;
            padding: 24px;
            border-radius: 16px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .modal-text {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .modal-btn {
            background: var(--primary-color);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            display: block;
            text-decoration: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container">
        <div class="header">
            <div class="app-logo">绘库 HK Design</div>
        </div>

        <div id="material-container">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="download-btn" onclick="showDownloadModal()">立即下载</button>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="downloadModal" onclick="hideDownloadModal(event)">
        <div class="modal">
            <div class="modal-title">下载 App</div>
            <div class="modal-text">请下载“绘库”App 免费获取该素材及更多高清资源。</div>
            <a href="https://hk.xbjy123.com/download" class="modal-btn">去下载</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api'; // Use relative path if hosted on same domain

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function fetchMaterial() {
            const id = getQueryParam('id');
            if (!id) {
                document.getElementById('material-container').innerHTML = '<div class="loading">参数错误</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/materials/${id}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const material = await response.json();

                renderMaterial(material);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('material-container').innerHTML = '<div class="loading">加载失败，请稍后重试</div>';
            }
        }

        function renderMaterial(material) {
            const container = document.getElementById('material-container');
            
            // Format format/size
            const format = material.format || 'UNK';
            const size = material.file_size ? (material.file_size / 1024 / 1024).toFixed(1) + 'MB' : '';

            container.innerHTML = `
                <div class="material-card">
                    <img src="${material.preview_url}" alt="${material.title}" class="preview-image" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                    <div class="content">
                        <div class="title">${material.title}</div>
                        <div class="meta-info">
                            <span>格式: ${format.toUpperCase()}</span>
                            <span>大小: ${size}</span>
                        </div>
                        <div class="tags">
                            <span class="tag">${material.category || '素材'}</span>
                            <span class="tag">高清</span>
                            <span class="tag">免费</span>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.6;">
                    <p>简介：${material.description || '暂无简介'}</p>
                </div>
            `;
        }

        function showDownloadModal() {
            document.getElementById('downloadModal').style.display = 'flex';
        }

        function hideDownloadModal(e) {
            if (e.target.id === 'downloadModal') {
                document.getElementById('downloadModal').style.display = 'none';
            }
        }

        // Initialize
        fetchMaterial();
    </script>
</body>
</html>
